<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 rounded-xl text-indigo-600 mb-3">
                <i class="fa-solid fa-right-to-bracket text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-sm text-slate-500 mt-1">Log in to participate in college discussions</p>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${param.success}" class="bg-emerald-50 text-emerald-800 text-sm p-3 rounded-lg mb-4 border border-emerald-200">
            Account created successfully! Please login.
        </div>
        <div th:if="${error}" class="bg-rose-50 text-rose-800 text-sm p-3 rounded-lg mb-4 border border-rose-200" th:text="${error}">
            Invalid credentials.
        </div>

        <form method="POST" action="/forum/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="you@college.edu" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Don't have an account? <a href="/forum/signup" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
        </p>
        <div class="text-center mt-3">
            <a href="/forum/home" class="text-xs text-slate-400 hover:text-slate-600">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
